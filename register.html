<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Pendaftaran Akun Pengguna TrueCost SMAHADA">
  <meta name="theme-color" content="#059669">
  <title>Daftar Akun - TrueCost SMAHADA</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans transition-colors duration-200">

  <!-- Floating Dark Mode Toggle (Top Right) -->
  <div class="fixed top-4 right-4 z-50">
    <button id="themeToggleBtn" type="button" aria-label="Ganti Tema"
      class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-amber-400 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-center transition-all hover:scale-105 active:scale-95 focus:outline-none">
      <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
    </button>
  </div>

  <main class="w-full max-w-md">
    <!-- Card Container -->
    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 dark:border-slate-700/60 relative overflow-hidden">
      
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-brand-600 via-emerald-400 to-teal-500"></div>

      <!-- Header & Brand Logo -->
      <div class="text-center mb-6">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-3">
          <i class="fa-solid fa-user-plus text-2xl"></i>
        </div>
        <h1 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Daftar Akun Baru</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          TrueCost SMAHADA • Mulai catat & kurangi jejak karbon jajanmu
        </p>
      </div>

      <!-- Alert Notifikasi Error (Tersembunyi secara default) -->
      <div id="errorAlert" class="hidden mb-5 p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 text-xs flex items-start gap-2.5 transition-all">
        <i class="fa-solid fa-circle-exclamation text-rose-500 mt-0.5 text-sm flex-shrink-0"></i>
        <div class="flex-1 font-medium leading-relaxed" id="errorMessage">
          Terjadi kesalahan saat pendaftaran.
        </div>
      </div>

      <!-- Alert Notifikasi Sukses (Tersembunyi secara default) -->
      <div id="successAlert" class="hidden mb-5 p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/60 text-emerald-800 dark:text-emerald-200 text-xs flex items-start gap-2.5 transition-all">
        <i class="fa-solid fa-circle-check text-emerald-500 mt-0.5 text-sm flex-shrink-0"></i>
        <div class="flex-1 font-medium leading-relaxed" id="successMessage">
          Pendaftaran berhasil! Mengalihkan ke beranda...
        </div>
      </div>

      <!-- Form Pendaftaran -->
      <form id="registerForm" class="space-y-4" novalidate>
        
        <!-- Field Username -->
        <div>
          <label for="usernameInput" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">
            Username <span class="text-rose-500">*</span>
          </label>
          <div class="relative rounded-2xl">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
              <i class="fa-solid fa-user"></i>
            </span>
            <input
              type="text"
              id="usernameInput"
              name="username"
              required
              minlength="3"
              maxlength="50"
              autocomplete="username"
              autofocus
              placeholder="Contoh: siswa_smahada"
              class="w-full pl-10 pr-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
            />
          </div>
          <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1 pl-1">
            Min. 3 karakter tanpa spasi (alfanumerik, _, -)
          </p>
        </div>

        <!-- Field Password -->
        <div>
          <label for="passwordInput" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">
            Password <span class="text-rose-500">*</span>
          </label>
          <div class="relative rounded-2xl">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input
              type="password"
              id="passwordInput"
              name="password"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Minimal 6 karakter"
              class="w-full pl-10 pr-11 py-3 rounded-2xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
            />
            <!-- Toggle Show/Hide Password -->
            <button
              type="button"
              id="togglePasswordBtn"
              aria-label="Lihat password"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors focus:outline-none"
            >
              <i id="passwordEyeIcon" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
          <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1 pl-1">
            Gunakan minimal 6 karakter kombinasi aman
          </p>
        </div>

        <!-- Tombol Daftar (Submit) -->
        <div class="pt-2">
          <button
            type="submit"
            id="submitBtn"
            class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-700 hover:to-emerald-600 text-white font-bold text-sm shadow-md shadow-brand-600/30 active:scale-[0.98] transition-all flex items-center justify-center space-x-2 disabled:opacity-60 disabled:cursor-not-allowed disabled:pointer-events-none"
          >
            <!-- Normal State Content -->
            <span id="btnText" class="flex items-center gap-2">
              <i class="fa-solid fa-user-check"></i>
              <span>Daftar Akun</span>
            </span>

            <!-- Loading Spinner (Tersembunyi secara default) -->
            <span id="btnSpinner" class="hidden flex items-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Mendaftarkan...</span>
            </span>
          </button>
        </div>

      </form>

      <!-- Footer Links -->
      <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-700/60 text-center">
        <a href="/" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span>Kembali ke Beranda TrueCost</span>
        </a>
      </div>

    </div>
  </main>

  <script>
    /* ====================================================================
       1. THEME INITIALIZATION (Light / Dark Mode)
       ==================================================================== */
    function initTheme() {
      const savedTheme = localStorage.getItem('truecost_theme') || 'light';
      const isDark = savedTheme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      updateThemeIcon(isDark);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('truecost_theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('themeIcon');
      if (!icon) return;
      icon.className = isDark ? 'fa-solid fa-sun text-base text-amber-400' : 'fa-solid fa-moon text-base text-slate-600';
    }

    /* ====================================================================
       2. FORM HANDLING & REGISTRATION LOGIC
       ==================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

      const form = document.getElementById('registerForm');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');
      const successMessage = document.getElementById('successMessage');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const passwordEyeIcon = document.getElementById('passwordEyeIcon');

      // Toggle visibilitas password
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        passwordEyeIcon.className = isPassword ? 'fa-regular fa-eye-slash text-sm' : 'fa-regular fa-eye text-sm';
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.classList.remove('hidden');
        successAlert.classList.add('hidden');
      }

      function showSuccess(msg) {
        successMessage.textContent = msg;
        successAlert.classList.remove('hidden');
        errorAlert.classList.add('hidden');
      }

      function clearAlerts() {
        errorAlert.classList.add('hidden');
        successAlert.classList.add('hidden');
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          btnText.classList.add('hidden');
          btnSpinner.classList.remove('hidden');
        } else {
          btnText.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
        }
      }

      // Submit Form
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlerts();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // Validasi Sisi Klien
        if (!username) {
          showError('Username wajib diisi.');
          usernameInput.focus();
          return;
        }

        if (/\s/.test(username)) {
          showError('Username tidak boleh mengandung spasi.');
          usernameInput.focus();
          return;
        }

        if (username.length < 3) {
          showError('Username minimal harus 3 karakter.');
          usernameInput.focus();
          return;
        }

        if (!password || password.length < 6) {
          showError('Password minimal harus 6 karakter.');
          passwordInput.focus();
          return;
        }

        setLoading(true);

        try {
          const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (!response.ok) {
            // Tampilkan pesan error spesifik dari API (misal username sudah dipakai)
            showError(data.message || 'Pendaftaran gagal. Silakan coba lagi.');
            setLoading(false);
            return;
          }

          // Registrasi Berhasil
          showSuccess(data.message || 'Pendaftaran berhasil! Selamat datang.');
          form.reset();

          // Simpan username di local storage (opsional)
          if (data.user?.username) {
            localStorage.setItem('truecost_user', data.user.username);
          }

          setTimeout(() => {
            window.location.href = '/';
          }, 1800);

        } catch (err) {
          console.error('Registration network error:', err);
          showError('Gagal terhubung ke server. Periksa koneksi internet Anda atau pastikan server aktif.');
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
